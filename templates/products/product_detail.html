{% extends "base.html" %}

{% block title %}
{{ product.name }}
{% endblock %}


{% block content %}

<div class="row">

    <div class="col-md-6">

        {% if product.image %}

            <img
                src="{{ product.image.url }}"
                class="img-fluid rounded shadow-sm"
                alt="{{ product.name }}"
            >

        {% endif %}

    </div>


    <div class="col-md-6">

        <h1>
            {{ product.name }}
        </h1>

        <h3 class="my-3">
            ৳{{ product.price }}
        </h3>

        <p>
            {{ product.description }}
        </p>

        <a
            href="{% url 'create_order' product.id %}"
            class="btn btn-success btn-lg"
        >
            Order Now
        </a>

    </div>

</div>

{% endblock %}
