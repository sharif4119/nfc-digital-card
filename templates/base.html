<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
        NFC Card
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a
            class="navbar-brand"
            href="/"
        >
            NFC Card
        </a>

        <div>
            {% if user.is_authenticated %}

                <a
                    href="{% url 'dashboard' %}"
                    class="btn btn-outline-light btn-sm"
                >
                    Dashboard
                </a>

                <form
                    method="post"
                    action="{% url 'logout' %}"
                    class="d-inline"
                >
                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn btn-danger btn-sm"
                    >
                        Logout
                    </button>
                </form>

            {% else %}

                <a
                    href="{% url 'login' %}"
                    class="btn btn-outline-light btn-sm"
                >
                    Login
                </a>

                <a
                    href="{% url 'register' %}"
                    class="btn btn-primary btn-sm"
                >
                    Register
                </a>

            {% endif %}
        </div>

    </div>
</nav>


<main class="container py-5">

    {% block content %}
    {% endblock %}

</main>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
