{% extends "base.html" %}

{% block title %}
Order {{ product.name }}
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-7">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h2>
                    Order {{ product.name }}
                </h2>

                <p class="text-muted">
                    Price: ৳{{ product.price }} per card
                </p>

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-success"
                    >
                        Place Order
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
